<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft WebSocket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .info-panel {
            background-color: #111111;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;
            min-width: 300px;
        }
        
        .info-title {
            font-size: 18px;
            color: #00ff00;
            margin-bottom: 10px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }
        
        .info-content {
            font-size: 16px;
            color: #cccccc;
            margin: 5px 0;
        }
        
        #time-display {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        #status {
            font-size: 16px;
            color: #888888;
        }
        
        .connected {
            color: #00ff00;
        }
        
        .disconnected {
            color: #ff0000;
        }
        
        .chat-button {
            background-color: #00ff00;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .chat-button:hover {
            background-color: #00cc00;
        }
        
        .chat-button:active {
            background-color: #009900;
        }
    </style>
</head>
<body>
    <div id="time-display">Waiting for data...</div>
     <div id="status" class="disconnected">Not connected</div>
     <div style="color: #ff9900; margin-bottom: 20px; text-align: center;">Periodic updates disabled - Use command testing below</div>
    
    <div class="info-panel">
        <div class="info-title">Coordinates</div>
        <div class="info-content" id="coordinates">X: -- Y: -- Z: --</div>
    </div>
    
    <div class="info-panel">
        <div class="info-title">Top Block</div>
        <div class="info-content" id="block-info">--</div>
    </div>
    
    <div class="info-panel">
        <div class="info-title">Command Testing</div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="command-input" placeholder="Enter Minecraft command..." style="flex: 1; padding: 8px; background: #222; color: #00ff00; border: 1px solid #00ff00; border-radius: 4px; font-family: 'Courier New', monospace;">
            <button class="chat-button" onclick="sendCommand()" style="margin: 0;">Send Command</button>
        </div>
        <div style="margin-top: 10px; font-size: 12px; color: #888;">
            Examples: /gettopsolidblock 0 64 0, /time query daytime, /querytarget @a
        </div>
    </div>
    
    <button class="chat-button" onclick="sendHelloWorld()">Say "Hello World"</button>
    
    <script>
        const timeDisplay = document.getElementById('time-display');
        const statusDisplay = document.getElementById('status');
        const coordinatesDisplay = document.getElementById('coordinates');
        const blockInfoDisplay = document.getElementById('block-info');
        
        // Connect to WebSocket on the same host
        const ws = new WebSocket(`ws://${window.location.host}`);
        
         function sendHelloWorld() {
             if (ws.readyState === WebSocket.OPEN) {
                 ws.send(JSON.stringify({
                     type: 'chat',
                     text: 'Hello World'
                 }));
                 console.log('Sent "Hello World" message');
             } else {
                 console.log('WebSocket not connected');
             }
         }
         
         function sendCommand() {
             const commandInput = document.getElementById('command-input');
             const command = commandInput.value.trim();
             
             if (!command) {
                 console.log('No command entered');
                 return;
             }
             
             if (ws.readyState === WebSocket.OPEN) {
                 ws.send(JSON.stringify({
                     type: 'command',
                     text: command
                 }));
                 console.log('Sent command:', command);
                 commandInput.value = ''; // Clear input
             } else {
                 console.log('WebSocket not connected');
             }
         }
         
         // Allow pressing Enter to send command
         document.getElementById('command-input').addEventListener('keypress', function(event) {
             if (event.key === 'Enter') {
                 sendCommand();
             }
         });
        
        ws.onopen = () => {
            console.log('Connected to server');
            statusDisplay.textContent = 'Connected to server';
            statusDisplay.className = 'connected';
        };
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'daytime') {
                    const daytime = data.value;
                    
                    // Convert Minecraft time to human-readable format
                    // Minecraft day cycle: 0 = dawn, 6000 = noon, 12000 = dusk, 18000 = midnight
                    const hours = Math.floor((daytime / 1000 + 6) % 24);
                    const minutes = Math.floor((daytime % 1000) / 1000 * 60);
                    
                    // Format time
                    const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                    
                    // Determine time of day
                    let timeOfDay = '';
                    if (daytime >= 0 && daytime < 6000) {
                        timeOfDay = 'Morning';
                    } else if (daytime >= 6000 && daytime < 12000) {
                        timeOfDay = 'Afternoon';
                    } else if (daytime >= 12000 && daytime < 18000) {
                        timeOfDay = 'Evening';
                    } else {
                        timeOfDay = 'Night';
                    }
                    
                    timeDisplay.innerHTML = `
                        <div>${timeString}</div>
                        <div style="font-size: 24px; margin-top: 10px;">${timeOfDay}</div>
                        <div style="font-size: 16px; margin-top: 10px; color: #666;">Ticks: ${daytime}</div>
                    `;
                } else if (data.type === 'coordinates') {
                    // Display only self coordinates in UI
                    const selfCoords = data.value.self;
                    if (selfCoords) {
                        coordinatesDisplay.textContent = `X: ${selfCoords.x.toFixed(1)} Y: ${selfCoords.y.toFixed(1)} Z: ${selfCoords.z.toFixed(1)}`;
                    }
                    // All player coordinates are available in data.value.all if needed later
                } else if (data.type === 'block') {
                    blockInfoDisplay.textContent = data.value;
                }
            } catch (error) {
                console.error('Error parsing message:', error);
            }
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            statusDisplay.textContent = 'Connection error';
            statusDisplay.className = 'disconnected';
        };
        
        ws.onclose = () => {
            console.log('Disconnected from server');
            statusDisplay.textContent = 'Disconnected from server';
            statusDisplay.className = 'disconnected';
            timeDisplay.textContent = 'Connection lost...';
        };
    </script>
</body>
</html>
