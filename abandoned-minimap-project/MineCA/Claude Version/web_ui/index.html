<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MineCA - Minecraft Minimap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with tabs -->
        <header class="header">
            <div class="tabs">
                <button class="tab active" data-tab="map">Map</button>
                <button class="tab" data-tab="inv">Inv</button>
                <button class="tab" data-tab="chat">Chat</button>
            </div>
            <div class="status">
                <span id="connection-status" class="status-disconnected">●</span>
                <span id="player-coords"></span>
            </div>
        </header>

        <!-- Map Tab -->
        <div id="map-tab" class="tab-content active">
            <div class="map-controls">
                <button id="zoom-out" class="control-btn">-</button>
                <span id="zoom-level">7x7</span>
                <button id="zoom-in" class="control-btn">+</button>
            </div>
            <canvas id="minimap"></canvas>
        </div>

        <!-- Inventory Tab -->
        <div id="inv-tab" class="tab-content">
            <div class="inventory-container">
                <div class="inventory-section">
                    <h3>Main Inventory</h3>
                    <div id="main-inventory" class="inventory-grid main-grid"></div>
                </div>
                <div class="inventory-section">
                    <h3>Hotbar</h3>
                    <div id="hotbar-inventory" class="inventory-grid hotbar-grid"></div>
                </div>
            </div>
        </div>

        <!-- Chat Tab -->
        <div id="chat-tab" class="tab-content">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="chat-send">Send</button>
            </div>
        </div>
    </div>

    <script src="blockColors.js"></script>
    <script src="app.js"></script>
</body>
</html>
